<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Eye in the Sky &#8212; Architecture</text>

  <!-- Android App box -->
  <rect x="80" y="64" width="840" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="500" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Android App (Kotlin / Jetpack Compose)</text>

  <g font-size="12.5" fill="#3730a3">
    <rect x="104" y="104" width="160" height="30" rx="7" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="184" y="123" text-anchor="middle">AR Star Map</text>
    <rect x="284" y="104" width="160" height="30" rx="7" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="364" y="123" text-anchor="middle">Astronomy 101</text>
    <rect x="464" y="104" width="160" height="30" rx="7" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="544" y="123" text-anchor="middle">Sky Watch</text>
    <rect x="644" y="104" width="172" height="30" rx="7" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="730" y="123" text-anchor="middle">Satellites</text>
  </g>

  <text x="500" y="156" text-anchor="middle" font-size="12" fill="#4338ca" font-family="Consolas, Monaco, monospace">CameraX + SensorManager &#8594; AR overlay renderer</text>
  <text x="500" y="176" text-anchor="middle" font-size="12" fill="#4338ca" font-family="Consolas, Monaco, monospace">Retrofit / OkHttp &#8594; FastAPI backend (HTTPS)</text>

  <!-- Arrow 1 -->
  <line x1="500" y1="194" x2="500" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="219" font-size="11.5" fill="#475569">HTTPS</text>

  <!-- FastAPI Gateway box -->
  <rect x="80" y="240" width="840" height="168" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="500" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">Python FastAPI Gateway</text>

  <g font-size="12" fill="#6b21a8">
    <rect x="104" y="280" width="120" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="164" y="298" text-anchor="middle">Auth</text>
    <rect x="232" y="280" width="140" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="302" y="298" text-anchor="middle">Quiz / Lesson</text>
    <rect x="380" y="280" width="120" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="440" y="298" text-anchor="middle">SkyInfo</text>
    <rect x="508" y="280" width="120" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="568" y="298" text-anchor="middle">Events</text>
    <rect x="636" y="280" width="150" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="711" y="298" text-anchor="middle">Notifications</text>
    <rect x="794" y="280" width="82" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="835" y="298" text-anchor="middle">JWST</text>

    <rect x="104" y="316" width="130" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="169" y="334" text-anchor="middle">Location</text>
    <rect x="242" y="316" width="140" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="312" y="334" text-anchor="middle">Satellites</text>
    <rect x="390" y="316" width="130" height="28" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="455" y="334" text-anchor="middle">Payments</text>
  </g>

  <text x="500" y="378" text-anchor="middle" font-size="12" fill="#86198f" font-family="Consolas, Monaco, monospace">Redis cache/broker &#8596; Celery workers + Beat scheduler</text>
  <text x="500" y="396" text-anchor="middle" font-size="11" fill="#86198f">TLE refresh (6h) &#183; event alert scan (daily) &#183; visibility refresh (3h) &#183; jwst_processing queue</text>

  <!-- Arrows 2 and 3 -->
  <line x1="320" y1="408" x2="250" y2="452" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="408" x2="750" y2="452" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PostgreSQL box -->
  <rect x="60" y="456" width="420" height="300" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="270" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">PostgreSQL</text>

  <g font-size="12.5" fill="#164e63" font-family="Consolas, Monaco, monospace">
    <text x="100" y="516">users</text>
    <text x="100" y="542">user_subscriptions &#183; transactions</text>
    <text x="100" y="568">lessons &#183; quiz_questions &#183; quiz_submissions</text>
    <text x="100" y="594">solar_events</text>
    <text x="100" y="620">notifications</text>
    <text x="100" y="646">location_entries</text>
    <text x="100" y="672">jwst_requests</text>
    <text x="100" y="698">star_watchlist &#183; astronomer_quotes</text>
  </g>

  <!-- External APIs box -->
  <rect x="520" y="456" width="420" height="300" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">External APIs</text>

  <g font-size="12.5" fill="#78350f" font-family="Consolas, Monaco, monospace">
    <text x="560" y="516">CelesTrak (TLE)</text>
    <text x="560" y="542">MAST / astroquery (JWST)</text>
    <text x="560" y="568">AstronomyAPI</text>
    <text x="560" y="594">Open Notify (ISS)</text>
    <text x="560" y="620">OpenWeather</text>
    <text x="560" y="646">N2YO</text>
    <text x="560" y="672">OpenStreetMap Nominatim</text>
    <text x="560" y="698">Stripe &#183; M-Pesa &#183; Paystack</text>
  </g>

  <text x="500" y="784" text-anchor="middle" font-size="11" fill="#64748b">Backend: Python 3.11 / FastAPI / SQLAlchemy / Celery &#8212; containerised with Docker Compose</text>
</svg>
